services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: bullforge
      POSTGRES_PASSWORD: bullforge_dev
      POSTGRES_DB: bullforge
    ports:
      - "15432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bullforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  data_pipeline:
    build:
      context: .
      dockerfile: services/data_pipeline/Dockerfile
    env_file:
      - .env
    environment:
      TIMESCALEDB_HOST: timescaledb
      REDIS_HOST: redis
    ports:
      - "18080:8080"
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  feature_engine:
    build:
      context: .
      dockerfile: services/feature_engine/Dockerfile
    env_file:
      - .env
    environment:
      TIMESCALEDB_HOST: timescaledb
      REDIS_HOST: redis
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      data_pipeline:
        condition: service_started
    restart: unless-stopped

  model_service:
    build:
      context: .
      dockerfile: services/model_service/Dockerfile
    env_file:
      - .env
    environment:
      TIMESCALEDB_HOST: timescaledb
      REDIS_HOST: redis
      MODEL_ARTIFACTS_DIR: /app/models/artifacts
    ports:
      - "18081:8081"
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      feature_engine:
        condition: service_started
    volumes:
      - model_artifacts:/app/models/artifacts
    restart: unless-stopped

  execution_service:
    build:
      context: .
      dockerfile: services/execution_service/Dockerfile
    env_file:
      - .env
    environment:
      TIMESCALEDB_HOST: timescaledb
      REDIS_HOST: redis
    ports:
      - "18082:8082"
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      model_service:
        condition: service_started
    restart: unless-stopped

volumes:
  timescaledb_data:
  redis_data:
  model_artifacts:
